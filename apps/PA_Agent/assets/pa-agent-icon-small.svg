    <path id="a" fill-rule="evenodd" d="M181 116C161 116 148 130 148 151C148 172 161 185 178 185C185 185 191 182 195 178V183H215V117H195V124C191 119 187 116 181 116ZM182 137C190 137 195 143 195 151C195 159 190 165 182 165C174 165 169 159 169 151C169 143 174 137 182 137Z"/>
  </g>
  <g id="candlestick" fill="#79A9DD">
    <path id="wick" d="M54 53H70V205H54Z"/>
