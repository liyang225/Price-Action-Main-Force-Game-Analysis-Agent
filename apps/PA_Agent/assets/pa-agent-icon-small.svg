<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title description">
  <title id="title">PA Agent — Pa candlestick icon (small-size hinted)</title>
  <desc id="description">Small-size (16/24/32px) version of the 256px master: identical letterforms, candle body widened 28 to 40 units and wick 10 to 16 units (scheme C, body/wick ratio 2.5) so the candlestick stays readable when rasterized small. Tile stroke dropped (sub-pixel at these sizes).</desc>
