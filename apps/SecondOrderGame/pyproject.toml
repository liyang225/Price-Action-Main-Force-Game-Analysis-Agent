[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_backend"

[project]
name = "secondordergame"
version = "0.1.0"
description = "二阶博弈系统 - 基于博弈论与情绪周期的推演分析模块"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "futu-api>=6.0.0",
    "akshare>=1.18.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "PyQt6>=6.6.0",
]

[project.scripts]
secondordergame-parameters = "src.gui.workbench:main"
secondordergame-labeler-nightly = "src.labeler.nightly:main"
secondordergame-capital-flow-daily = "src.data.capital_flow_daily:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".scratch/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
