# ============================================================
# SecondOrderGame — 板块列表构成规则
# ============================================================
# 决策依据：ADR-0013
# 术语定义：CONTEXT.md
#
# 版本管理：修改任何数值前先递增 version，
#           分析记录须保存当时使用的版本号
# ============================================================

version: 1

# ----------------------------------------------------------
# 容量
# ----------------------------------------------------------
# cap 由限频反推：消息搜索 10 次/30 秒 → 每 3 秒一个板块
#   28 个 = 84 秒（当前选择，午盘 90 分钟余量充足）
#   40 个 = 120 秒
#   60 个 = 180 秒
# 若将来可接受 2 分钟预取周期，cap 可提到 40
# ----------------------------------------------------------
capacity:
  cap: 28

  # 自选池所涉板块全量入册，不受 cap 约束。
  # 超配额时只截断榜单部分。
  # 理由：看不见持仓板块是不可接受的失效；
  #       错过陌生板块只是错过机会。
  watchlist_exempt_from_cap: true


# ----------------------------------------------------------
# 榜单来源
# ----------------------------------------------------------
# 取涨跌两端，不只取涨幅榜。
# 跌幅榜承载资金撤出方向，在跷跷板效应下预示资金下一站。
# 「老登股放量下跌」是成长板块启动的前兆。
# ----------------------------------------------------------
movers:
  top_gainers: 5
  top_losers: 5


# ----------------------------------------------------------
# 去重
# ----------------------------------------------------------
dedup:
  key: sector_code

  # 同一板块可同时携带「自选」和「榜单」两个来源标记，
  # 不去掉其中之一。两者解读不同：
  #   watchlist = 必看（持仓所在）
  #   movers    = 机会扫描（今日异动）
  # 同时带两个标记 = 持仓踩在风口上，审计记录里有价值。
  preserve_source_tags: true

  source_tags:
    - watchlist
    - movers


# ----------------------------------------------------------
# 刷新与冻结
# ----------------------------------------------------------
# 每决策点前刷新一次，刷新后在该轮预取+决策期间冻结。
#
# 冻结理由（可复现性）：列表若在预取中变化，
#   已搜板块被移出 → 配额浪费，材料不属于任何在册板块
#   新入册来不及搜 → 决策时无消息材料
# 两者都会让分析记录的「在册板块」字段对不上实际材料。
#
# 代价：突发异动板块延迟至下一决策点，最多半个交易日。
# ----------------------------------------------------------
refresh:
  schedule:
    - "11:00"   # 午盘决策点（11:30）前 30 分钟：预取 84 秒，余量充足
    - "14:30"   # 收盘决策点（15:00）前 30 分钟
    # 贴近决策点，让在册列表尽量反映决策时刻的真实异动。
    # 30 分钟 = 84 秒预取 + 充足重试余量。

  freeze_during_prefetch: true
  allow_intraday_mutation: false


# ----------------------------------------------------------
# 板块指数数据源
# ----------------------------------------------------------
# 与 labeler 配置保持一致。变更时两层标签均需重算。
# ----------------------------------------------------------
index_source: futu_industry_weighted
