# ============================================================
# SecondOrderGame — 板块情绪指数分值规则
# ============================================================
# 决策依据：ADR-0014
# 术语定义：CONTEXT.md
#
# ⚠ 本文件的分值不用于推导情绪周期位置。
#   指数是连续量，档位是离散判断（大模型输出 + 混淆矩阵折算）。
#   用阈值从指数映射到档位会作废混淆矩阵的整个设计。
# ============================================================

version: 1

# ----------------------------------------------------------
# 取值范围
# ----------------------------------------------------------
range:
  min: 0
  baseline: 50    # 区间中点，上下行空间对称
  max: 100


# ----------------------------------------------------------
# 日变动配额
# ----------------------------------------------------------
# daily_net: 日上限 ±15 → 从基准走到极端需 3–4 个交易日
#            （符合钟摆节奏，防止单日跳到极值）
#            单日反转由「政策环境」字段表达，不由本指数承担
#
# price_action > news: 真金白银比新闻标题可信
#                      分离均衡 vs 混同均衡在分值上的体现
# 行情增量按日收益率 × 200 计算，分项限幅为 ±15。
#
# single_news < daily_net: 任何单条消息无法独占当日变动空间
#                          「不因一条消息扭转情绪」的量化表达
# ----------------------------------------------------------
quota:
  daily_net: 15
  news: 8
  price_action: 15
  single_news: 8


# ----------------------------------------------------------
# 新闻预分析与分值转换
# ----------------------------------------------------------
# sentiment_score 的定义域为 [-8, 8]（大模型直接输出加减分强度）。
# 先按相关性、有效期、来源可信度、主体目的折算；每条仍受 quota.single_news 约束。
news_scoring:
  max_age_days: 7
  half_life_days: 3
  default_relevance: 0.7
  unrelated_relevance: 0.25
  default_source_credibility: 0.65
  major_media_credibility: 0.85
  authoritative_source_credibility: 1.0


# ----------------------------------------------------------
# 惯性衰减
# ----------------------------------------------------------
# 今日 = 50 + (昨日 − 50) × decay + 当日净增量
#
# decay 0.9 → 无新信息时偏离每日收敛一成，
#             约 7 个交易日回到原偏离的一半
# 只保留昨日值，不维护历史序列
# ----------------------------------------------------------
inertia:
  decay: 0.9

  # ⚠ 实现易错点：无消息日不等于跳过情绪更新。
  #   消息增量为零，但行情增量与衰减照常施加。
  #   写错的后果：缩量横盘的冷门板块情绪永久冻结在历史值
  #   （既无消息又无明显行情，若因「无消息」跳过更新，
  #     衰减就永远不会发生）
  apply_decay_on_no_news_days: true
  apply_price_action_on_no_news_days: true


# ----------------------------------------------------------
# 重大行情削减消息面
# ----------------------------------------------------------
# 触发后消息面配额 × 0.4（减 60%），行情面不变。
#
# 双向削减：利好与利空同时削减。
#   利空也削减的理由：价格已把利空定价，
#   再让消息面利空压低情绪 = 同一信息计两次。
#
# 不清零的理由：极端行情下仍可能出现政策转向类重要消息，
#              完全失声的代价更大。
# ----------------------------------------------------------
major_move_suppression:
  triggers:
    single_day_drop: -0.05      # 板块指数单日跌超 5%
    two_day_cumulative: -0.08   # 两日累计跌超 8%

  news_quota_multiplier: 0.4    # ±8 → ±3.2
  price_action_unaffected: true
  bidirectional: true           # 利好利空同时削减


# ----------------------------------------------------------
# 板块指数数据源
# ----------------------------------------------------------
# 与 sectors.yaml / labeler 配置保持一致
# ----------------------------------------------------------
index_source: futu_industry_weighted
