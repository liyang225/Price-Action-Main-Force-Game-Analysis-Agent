# 个股层事后标注器规则（冻结定义）
#
# ⚠ 标注器是定义，不是真相（ADR-0007）。本文件把抽象概念「出货」映射成可程序
# 验证的条件，这个映射是人为选择。一旦冻结，不能为了让准确率好看而修改。
#
# ⚠ 改任何阈值 = 作废全部已积累的 W 计数。流程（ADR-0017）：
#     1. 新建 ADR 说明修改原因
#     2. 递增 version，重算 rule_hash
#     3. 全量重标历史
#     4. 重建 W 计数
#   未完成重算前禁止新旧计数混用。
#
# 本文件的阈值来自 .scratch/business-rules 的实测研究（94,594 个有效
# 「股票 × 交易日」，12 板块 60 股，2020-01-01 至 2026-08-10）。报告见
# .scratch/business-rules/reports/02-05。研究期的候选版本为
# candidate-2026-08-10，规则 SHA256 d3e8759a1ba26faf66a6a8a1eef2d1db473f601ce65fd14c38be86cd2541f60a。

version: 1

# ---------------------------------------------------------------------------
# 前向收益口径
# ---------------------------------------------------------------------------
# 用板块超额收益：个股前向收益 - 同期主板块指数前向收益。
#
# 为什么不用绝对收益：实测显示绝对口径把行业共同冲击混进标签。绝对口径的
# 25,027 个负向行里，13,970 行在相对口径下是中性、446 行甚至是正向。
# 极端市场日（沪深300 前向五日 <= -3%，147 个交易日、8,685 行、占 9.18%）
# 绝对口径负向占 61.69%，相对口径仅 23.41% —— 绝对口径在最激烈时段最失真。
#
# 为什么不用「绝对收益 + 剔除极端市场日」：那要丢掉 9.18% 的样本，
# 而且丢的恰好是信息量最大的时段，同时不解决非极端日的共同板块波动。
forward_return:
  feature: forward_excess_return
  benchmark: primary_sector_index
  window_bars: 5                  # 五个交易日，六类规则统一窗口

  # 不按行为区分窗口。没有独立人工意图真值时，「出货窗口应短于建仓」
  # 这类差异化调参无法验证，只会把同一数据上的调参误当成验证。
  per_behavior_window: false

# 基准缺失时的处置：保持无标签并记录原因。
# 绝不替换为沪深300、其他板块或个股均值 —— 静默换基准会让标签含义漂移。
missing_benchmark_policy: no_label

# ---------------------------------------------------------------------------
# 两层独立的定义（ADR-0007 的澄清）
# ---------------------------------------------------------------------------
# 「独立」= 个股标注器有独立的代码、规则配置、规则哈希和输出，不读取板块情绪
# 标签、板块标注器输出或其派生统计。
#
# 它可以只读同日不可变的原始板块 OHLCV 作为相对收益的外生基准。防的是
# 跨层标签泄漏与自我强化，不是禁止读取公共行情事实。
independence:
  may_read_sector_ohlcv: true     # 原始行情，不可变
  may_read_sector_labels: false   # 标签与派生统计，禁止
  may_read_sector_sentiment: false

# ---------------------------------------------------------------------------
# 特征定义
# ---------------------------------------------------------------------------
features:
  return_1d: "当日收益"
  forward_return: "前向五日板块超额收益"
  volume_ratio_20: "成交量 / 前 20 日成交量中位数"
  close_position: "(close - low) / (high - low)，当日振幅中的收盘位置"
  lower_shadow_ratio: "下影线 / 振幅"
  upper_shadow_ratio: "上影线 / 振幅"
  support_break_pct: "相对前 20 日最低点的跌破幅度"
  resistance_break_pct: "相对前 20 日最高点的突破幅度"
  future_rebound_return: "前向窗口内收盘价的最大反弹幅度"

lookback:
  support_resistance_bars: 20
  volume_median_bars: 20

# 零振幅 K 线（high == low，一字板）：影线/实体比设 0，收盘位置设 0.5，
# 避免无穷值。不跳过该行。
zero_range_bar:
  shadow_ratio: 0.0
  close_position: 0.5

# 停牌：前视五日内停牌时，窗口不延长到五根后续 K 线，直接无标签。
# 延长窗口会让「五日」在不同样本上代表不同的真实时间跨度。
suspension_policy: no_label

# ---------------------------------------------------------------------------
# 六条行为规则
# ---------------------------------------------------------------------------
thresholds:
  建仓:
    return_1d_min: -0.02
    return_1d_max: 0.02
    forward_min: 0.03
    volume_ratio_max: 1.60
    close_position_min: 0.45

  震仓:
    return_1d_max: -0.02
    forward_min: 0.02
    lower_shadow_min: 0.25
    rebound_min: 0.03
    support_break_min: -0.005      # 未有效跌破支撑（> -0.5%）
    volume_ratio_max: 1.20         # 缩量

  拉升:
    return_1d_min: 0.03
    forward_min: 0.05
    volume_ratio_min: 1.15
    close_position_min: 0.60
    resistance_break_min: 0.0

  出货:
    return_1d_min: -0.02
    return_1d_max: 0.02
    forward_max: -0.03
    volume_ratio_min: 1.20
    upper_shadow_min: 0.25
    resistance_break_min: -0.02

  观望:
    return_1d_abs_max: 0.01
    forward_abs_max: 0.02
    volume_ratio_max: 1.30

  狩猎止损:
    return_1d_max: -0.01
    forward_min: 0.015
    support_break_max: -0.005      # 有效跌破支撑（<= -0.5%）
    lower_shadow_min: 0.30
    rebound_min: 0.02
    volume_ratio_min: 1.20         # 放量

# ⚠ 震仓与狩猎止损的区分点，改阈值时最容易破坏：
#   震仓  = 缩量（<= 1.20）+ 未有效跌破支撑（support_break > -0.5%）
#   狩猎  = 放量（>= 1.20）+ 有效跌破支撑（support_break <= -0.5%）
# 两者在支撑边界和成交量方向上互斥，实测共同命中为 0（并集 763 行）。
# 这是规则级互斥，不是人工真值下的真实误分类率 —— 没有逐日人工裁决，
# 不能声称已验证真实混淆率。

# ---------------------------------------------------------------------------
# 标签基数与优先级
# ---------------------------------------------------------------------------
# 每只股票每个交易日只输出一个标签。
#
# 为什么不能拆分计数：W 的每一行必须是和为 1 的概率分布，Dirichlet 更新把
# 每个交易日视为一次观测。把 1 天拆成 0.6/0.4 会引入非整数伪计数；让同一天
# 进入两次会把同一份价格信息复制成两个样本。这是数学约束，不是可选折中。
cardinality:
  labels_per_stock_day: 1
  allow_fractional_counts: false

# 排序依据：形态特异性优先，广义或安静状态后置。
# 狩猎止损同时要求击穿支撑 + 长下影 + 承接放量 + 后续反弹，证据最特异；
# 观望是明确的低波动低量条件，不能覆盖任何更特异的活动信号。
#
# 实测多命中 13 次（0.0137%），唯一组合是「建仓 + 狩猎止损」，
# 消解后只有建仓从 4,292 减到 4,279。
priority: [狩猎止损, 震仓, 拉升, 出货, 建仓, 观望]

# ---------------------------------------------------------------------------
# 无标签交易日
# ---------------------------------------------------------------------------
# 真正未命中的交易日输出无标签，不更新 W 计数，保存行级特征供日后重标。
#
# ⚠ 绝不兜底为「观望」。实测：兜底会让观望从 19,401 行涨到 88,459 行
#   （4.56 倍），把「主力主动不动」的业务含义和「规则不知道」混成一列，
#   观望这一列的解释力直接归零。
#
# 未命中不是极端行情垃圾桶：其当日收益中位数 -0.213%（四分位 -1.820% ~
# 1.832%），前向五日超额中位数 -0.390%，成交量比中位数 1.064 —— 大量样本
# 是温和、混合或边界证据不足的走势。
unlabeled:
  fallback_to_watch: false
  update_w_counts: false
  persist_row_features: true      # 供新版本规则按原始数据回溯重标

# 覆盖率监控。实测基线 26.99%，按年在 21.78% ~ 36.41% 之间，
# 按板块在 19.64% ~ 39.07% 之间 —— 板块间约两倍差异，必须按板块监控，
# 只看全局均值会掩盖单板块退化。
coverage_monitor:
  window_trading_days: 60
  pool: per_sector                # 不是 global
  alert_threshold: 0.20
  consecutive_windows_to_escalate: 2

  # 20% 的来历：每板块约 5 只股票，60 日约 300 个股票日。以基线 26.99% 计，
  # 20% 比基线低约 2.7 个二项抽样标准误。这是运营控制线，不是统计显著性
  # 保证 —— 序列相关会降低有效样本量。
  #
  # ⚠ 该阈值基于「每板块约 5 只股票」的研究样本。生产池大小变化后
  #   必须重新推导，不能沿用。
  derived_from_pool_size: 5

  # 告警后的处置：保存触发窗口 + 规则哈希 + 输入数据哈希 + 未命中行，
  # 由负责人审查是新市场机制、数据问题还是阈值过严。
  on_alert: freeze_and_escalate

# ---------------------------------------------------------------------------
# 规则哈希
# ---------------------------------------------------------------------------
# 发布时计算本文件的 SHA256，与它产生的每条标签一起存档。
# 修改个股规则不作废板块层已积累的计数，反之亦然（ADR-0007）。
rule_hash:
  algorithm: sha256
  scope: this_file
  store_with_every_label: true
