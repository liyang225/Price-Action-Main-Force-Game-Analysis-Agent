# ============================================================
# SecondOrderGame — HMM 手写先验配置
# ============================================================
# 版本管理规则：
#   - 每次修改任意数值前，先将本文件版本号 +1
#   - 所有分析记录中保存当时使用的版本号
#   - 修改本文件 = 使历史先验权重失去可比性（属正常代价）
#
# 先验强度公式（ADR-0001）：
#   α₀ = m(1-m)/sd² − 1
#   「大概 55%，偏差 ±10 个点」→ sd=0.10 → α₀ ≈ 24
#   「大概 55%，偏差 ±20 个点」→ sd=0.20 → α₀ ≈ 5
#   α 下限 0.3（保证单次异常可撼动后验）
#
# 术语定义见：CONTEXT.md
# ============================================================

version: 5

# ----------------------------------------------------------
# A：情绪周期转移矩阵
# ----------------------------------------------------------
# 语义：A[from_state][to_state] = 「本 K 线处于 from 状态时，
#        下根 K 线转移到 to 状态」的先验概率（每行归一化到 1.0）
#
# 每行包含：
#   各目标状态的转移概率（直接平铺，与 alpha 并列）
#   alpha：该行的 Dirichlet 先验强度（ESS）
# ----------------------------------------------------------
transition_matrix:

  冰点:
    冰点:  0.55
    启动:  0.35
    发酵:  0.05
    高潮:  0.00
    退潮:  0.05
    alpha: 5

  启动:
    冰点:  0.05
    启动:  0.45
    发酵:  0.40
    高潮:  0.08
    退潮:  0.02
    alpha: 10

  发酵:
    冰点:  0.02
    启动:  0.08
    发酵:  0.35
    高潮:  0.45
    退潮:  0.10
    alpha: 8

  高潮:
    冰点:  0.00
    启动:  0.02
    发酵:  0.08
    高潮:  0.35
    退潮:  0.55
    alpha: 12

  退潮:
    冰点:  0.45
    启动:  0.05
    发酵:  0.05
    高潮:  0.00
    退潮:  0.45
    alpha: 8


# ----------------------------------------------------------
# C：大模型观测混淆矩阵（噪声传感器）
# ----------------------------------------------------------
# 语义：C[true_X][llm_Y] = 「真实状态是 X 时，大模型输出
#        标签 Y 的概率」（每列即每个 true_X 块归一化到 1.0）
#
# 用法（前向滤波更新步）：
#   b_t(z) ∝ C[z][llm_ℓ_t] × b_pred(z)
# ----------------------------------------------------------
confusion_matrix:

  true_冰点:
    llm_冰点:  0.55
    llm_启动:  0.25
    llm_发酵:  0.10
    llm_高潮:  0.02
    llm_退潮:  0.08
    alpha: 5

  true_启动:
    llm_冰点:  0.15
    llm_启动:  0.55
    llm_发酵:  0.20
    llm_高潮:  0.05
    llm_退潮:  0.05
    alpha: 4

  true_发酵:
    llm_冰点:  0.05
    llm_启动:  0.20
    llm_发酵:  0.50
    llm_高潮:  0.15
    llm_退潮:  0.10
    alpha: 4

  true_高潮:
    llm_冰点:  0.02
    llm_启动:  0.05
    llm_发酵:  0.18
    llm_高潮:  0.60
    llm_退潮:  0.15
    alpha: 5

  true_退潮:
    llm_冰点:  0.10
    llm_启动:  0.03
    llm_发酵:  0.12
    llm_高潮:  0.20
    llm_退潮:  0.55
    alpha: 5


# ----------------------------------------------------------
# W：情绪周期位置 → 主力行为概率映射
# ----------------------------------------------------------
# 语义：W[cycle][participant][behavior] = 「板块情绪处于
#        cycle 时，participant 执行 behavior 的概率」
#        每个 participant 行归一化到 1.0
#
# T+1 行为概率：P(behavior) = Σ_z b_t(z) × W_eff[z, p, behavior]
#
# 参与者从三方压缩为二方（ADR-0018）：
#   - 操纵型主力与配置型主力合并为「主力」
#   - 合并策略：按 ESS 加权平均（操纵型 ESS=5, 配置型 ESS=8）
#   - 权重：配置型 = 8/(5+8) = 0.615, 操纵型 = 0.385
# ----------------------------------------------------------
behavior_mapping:

  冰点:
    主力:
      建仓:     0.49  # 0.40×0.385 + 0.55×0.615
      震仓:     0.11  # 0.20×0.385 + 0.05×0.615
      拉升:     0.05  # 0.05×0.385 + 0.05×0.615
      出货:     0.02  # 0.05×0.385 + 0.00×0.615
      观望:     0.29  # 0.20×0.385 + 0.35×0.615
      狩猎止损: 0.04  # 0.10×0.385 + 0.00×0.615
      alpha: 11       
    散户:
      FOMO追高: 0.00
      恐慌割肉: 0.55
      观望:     0.30
      理性跟随: 0.00
      底部建仓: 0.10
      高位减仓: 0.05
      alpha: 5

  启动:
    主力:
      建仓:     0.26  # 0.20×0.385 + 0.30×0.615
      震仓:     0.18  # 0.30×0.385 + 0.10×0.615
      拉升:     0.34  # 0.25×0.385 + 0.40×0.615
      出货:     0.05  # 0.05×0.385 + 0.05×0.615
      观望:     0.15  # 0.15×0.385 + 0.15×0.615
      狩猎止损: 0.02  # 0.05×0.385 + 0.00×0.615
      alpha: 11
    散户:
      FOMO追高: 0.05
      恐慌割肉: 0.10
      观望:     0.40
      理性跟随: 0.15
      底部建仓: 0.25
      高位减仓: 0.05
      alpha: 5

  发酵:
    主力:
      # v3 按「趋势确认 + 赚钱效应扩散」重新设定，不继承旧分歧行。
      建仓:     0.14
      震仓:     0.22
      拉升:     0.38
      出货:     0.10
      观望:     0.13
      狩猎止损: 0.03
      alpha: 11
    散户:
      FOMO追高: 0.15
      恐慌割肉: 0.05
      观望:     0.20
      理性跟随: 0.35
      底部建仓: 0.15
      高位减仓: 0.10
      alpha: 5

  高潮:
    主力:
      建仓:     0.02  # 0.02×0.385 + 0.02×0.615
      震仓:     0.06  # 0.08×0.385 + 0.05×0.615
      拉升:     0.21  # 0.30×0.385 + 0.15×0.615
      出货:     0.56  # 0.50×0.385 + 0.60×0.615
      观望:     0.13  # 0.05×0.385 + 0.18×0.615
      狩猎止损: 0.02  # 0.05×0.385 + 0.00×0.615
      alpha: 11
    散户:
      FOMO追高: 0.55
      恐慌割肉: 0.02
      观望:     0.10
      理性跟随: 0.15
      底部建仓: 0.03
      高位减仓: 0.15
      alpha: 5

  退潮:
    主力:
      建仓:     0.08  # 0.05×0.385 + 0.10×0.615
      震仓:     0.09  # 0.15×0.385 + 0.05×0.615
      拉升:     0.05  # 0.05×0.385 + 0.05×0.615
      出货:     0.34  # 0.40×0.385 + 0.30×0.615
      观望:     0.37  # 0.15×0.385 + 0.50×0.615
      狩猎止损: 0.07  # 0.20×0.385 + 0.00×0.615
      alpha: 11
    散户:
      FOMO追高: 0.02
      恐慌割肉: 0.50
      观望:     0.25
      理性跟随: 0.03
      底部建仓: 0.05
      高位减仓: 0.15
      alpha: 5


