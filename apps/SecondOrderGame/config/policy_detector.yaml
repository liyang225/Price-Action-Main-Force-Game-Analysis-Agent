# ============================================================
# SecondOrderGame — 政策环境感知检测配置
# ============================================================
# 版本管理规则：修改任何数值前先 +1；分析记录保存所用版本号。
#
# 政策环境不改变推演结构，只通过 policy_multipliers 乘法因子改变
# 各行为的概率分布（见 hmm_prior.yaml）。检测器只做「选组」，不触碰
# HMM 状态，因此与「状态重置信号」有本质区别（后者暗示另一条推演路径）。
#
# 检测输出（PolicyDetector.detect）决定选用哪一组 policy_multipliers 因子：
#   无干预 / 政策暖风 / 国家队托底中 / 政策打压
# ============================================================

version: 1

# ----------------------------------------------------------
# 硬信号：宽基 ETF 异常放量（汇金惯用通道）
# ----------------------------------------------------------
# 判定：当日成交量 / 前 volume_lookback_bars 根日 K 成交量中位数
#       >= abnormal_volume_ratio 视为异常放量；
#       满足条件的 ETF 数量 >= minimum_confirmations 时，硬信号成立
#       → 政策环境 = 国家队托底中（硬信号优先于冲突的软信号）。
# 代码使用富途格式（SH./SZ. 前缀）。
etfs:
  - code: "SH.510300"      # 沪深300ETF（华泰柏瑞）
    benchmark: "沪深300"
  - code: "SH.510050"      # 上证50ETF（华夏）
    benchmark: "上证50"

volume_lookback_bars: 5        # 历史成交量中位数回看窗口（根，日 K）
abnormal_volume_ratio: 2.0     # 当日量 / 历史中位数 >= 该值视为异常放量
minimum_confirmations: 2       # 至少几只 ETF 同时异常放量才确认硬信号
history_calendar_days: 30      # 拉取 ETF 日 K 的历史自然日窗口
ktype: "K_DAY"                 # 硬信号使用日 K

# ----------------------------------------------------------
# 软信号：原始新闻文本固定检测词
# ----------------------------------------------------------
# 数据来源：DailyMaterialCache 的 news 类别，直接扫描各板块原始新闻的
#           title + snippet 文本（不读取消息预分析结论）。
# 匹配方式：文本命中任一关键词即产生一条软证据；同一文本按规则顺序
#          只计一次（托底 > 打压 > 暖风），冲突时靠前优先。
# 词表说明：
#   政策暖风   业务词写广写全，覆盖常规政策利好语境（A 股政策环境以
#              暖风为主，宁可多命中也不漏判）；
#   国家队托底 以汇金/增持/托底为核心词；
#   政策打压   该环境在 A 股基本不存在，仅保留极少量词维持结构完整性，
#              软信号几乎不会命中（四环境结构由 policy_multipliers 保留）。
soft_rules:
  国家队托底中:
    - 国家队
    - 中央汇金
    - 汇金
    - 增持ETF
    - ETF增持
    - 增持宽基
    - 托底
    - 护盘
    - 平准基金
    - 入市
  政策打压:
    - 从严监管
    - 政策打压
  政策暖风:
    - 政策
    - 国家
    - 政府
    - 中央
    - 国务院
    - 央行
    - 财政部
    - 国常会
    - 政治局
    - 降准
    - 降息
    - 降税
    - 减税
    - 定向降准
    - 释放流动性
    - 逆回购
    - MLF
    - LPR
    - 稳市场
    - 稳定市场
    - 稳定资本市场
    - 支持资本市场
    - 政策支持
    - 政策利好
    - 政策暖风
    - 利好政策
    - 提振
    - 提振信心
    - 增强信心
    - 注入信心
    - 增量资金
    - 长期资金
    - 耐心资本
    - 中长期资金
    - 引导资金
    - 呵护
    - 政策呵护
    - 积极政策
    - 宽松
    - 货币政策宽松
    - 财政发力
    - 专项债
    - 特别国债
    - 超长期特别国债
    - 扩大内需
    - 促消费
    - 稳增长
    - 稳经济
    - 稳预期
    - 新质生产力
    - 高质量发展
    - 产业政策
    - 补贴
    - 扶持
    - 支持实体经济
    - 经济复苏
    - 经济回暖
    - 景气回升
