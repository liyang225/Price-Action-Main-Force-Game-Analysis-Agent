# 博弈量化信号参数
#
# ⚠ 专家先验推演，非统计估计。
#
# 本文件所有数值的来源是《博弈论量化信号参考.docx》。该文档注释原文写明
# 「4日周期适应加密市场高频博弈特征」「2%偏差率平衡敏感性与稳定性，基于历史优化得出」
# —— 优化对象是加密市场日线，不是 A 股 120 分钟线。因此这些值与 hmm_prior.yaml
# 的 alpha 同性质：可审计的起点，不是已在本市场验证的参数。
#
# 每个参数标注 source：
#   doc        文档给出明确数值，原样采用
#   doc-scaled 文档给出数值，按 K_120M 周期语义换算（见 period_semantics）
#   decided    文档未给出，由 ADR-0016 拍板
#   doc-void   文档明确挂空或只有定性描述，本文件不填，实现按 fallback 处理
#
# 修改任何值之前必须递增 version，且分析记录必须存下所用 version。

version: 3

# ---------------------------------------------------------------------------
# 周期语义换算
# ---------------------------------------------------------------------------
# 文档所有周期单位是「日」，本系统 K 线是 K_120M，一个交易日两根（09:30-11:30
# 与 13:00-15:00）。所有周期类参数按 ×2 换算，保留文档的时间跨度语义。
#
# 为什么不直接把文档的数字当根数用：文档对 nash_period=4 的语义是
# 「4日价格均值，市场集体预期锚点」。当成 4 根 K 线就是 2 个交易日，
# 锚点比一次日内波动还短，失去「集体预期」的含义。
#
# 阈值类参数（RSI 70/30、成交量倍数、百分比）不随周期换算。
period_semantics:
  source_unit: trading_day        # 文档的周期单位
  target_unit: bar_120m           # 本系统的 K 线单位
  bars_per_day: 2
  scale_factor: 2

# ---------------------------------------------------------------------------
# 羊群行为（文档 4.1）
# ---------------------------------------------------------------------------
herd:
  rsi_length: 28                  # source: doc-scaled，文档 14 日
  rsi_overbought: 65              # source: decided，A 股实测校准（ADR-0025），原 doc 70
  rsi_oversold: 30                # source: doc，判定为 <
  volume_ma_length: 10            # source: doc-scaled，文档 5 日
  volume_multiple: 2.0            # source: doc（文档公式缺乘号，注释与正文均写「放大2倍以上」）
  momentum_lookback: 10           # source: doc-scaled，文档 close - close[5]
  momentum_ma_length: 10          # source: doc-scaled，文档 sma(momentum, 5)

  # 文档第三维度只写 momentum > momentum_ma（纯比较），正文用定性词
  # 「显著偏离」但未给幅度。保持纯比较，不自行发明偏离阈值。
  momentum_deviation_min: null    # source: doc-void，null = 仅比较大小

# ---------------------------------------------------------------------------
# 流动性陷阱 / 流动性猎杀（文档 4.2）
# ---------------------------------------------------------------------------
# 文档没有名为「止损狩猎」的章节，最接近的是本节。文档术语为「流动性猎杀」，
# 表 1 描述为「识别大资金利用散户止损进行的流动性猎杀」。
# 本项目行为标签「狩猎止损」的判定不使用本节，而使用 labeler.yaml 的事后规则；
# 本节产出的是实时观测特征。
#
# ⚠ 下方陷阱（trap_down）A 股语义反转（ADR-0026）：
#   文档语义是「主力猎杀空头止损后拉回」（看涨），但 A 股无做空，实测
#   「向下破位 + 当根收回 + 放量 + 心理位」触发后继续下跌（w2 方向准确率
#   43%，看跌视角 57%）。因此 trap_down 解读为「破位下跌延续」（看跌），
#   不再作为「狩猎止损」行为标签的盘中证据——后者由 labeler.yaml 用前视
#   反弹（forward_min≥1.5%）判定，仍为看涨。
liquidity_trap:
  lookback: 10                    # source: doc-scaled，文档 5 日高低点窗口
  break_reference_offset: 1       # source: doc，与上一根 K 线的极值比较（recent_high[1]）

  # 文档触发条件只有「破位后收回」这个布尔关系，没有任何回撤百分比。
  # 正文用定性词「快速回撤」。不填数值，实现即纯布尔判定。
  retracement_min: null           # source: doc-void
  breakout_margin_min: null       # source: doc-void，文档只要求 high > recent_high[1]

  volume_multiple: 2.0            # source: doc，复用羊群的 volume_spike
  psych_proximity: 0.02           # source: decided，A 股实测放宽（ADR-0025），原 0.01

  # ↓ A 股改造，见 ADR-0016
  # 文档规则是 close>100 按百取整、否则按十取整。这条在 A 股会静默失效：
  # 120 元的股票最近整百位是 100 或 200，距离 17%，1% 接近度永不满足，
  # liquidity_trap_up 对所有高价股直接死掉。
  psych_level_brackets:           # source: decided
    - {below: 10.0,   step: 0.5}
    - {below: 100.0,  step: 1.0}
    - {below: null,   step: 10.0}   # below: null = 无上界

# ---------------------------------------------------------------------------
# 机构资金流与聪明钱（文档 4.3）
# ---------------------------------------------------------------------------
smart_money:
  # 文档原文：smart_money = (close - open) / (high - low) * volume
  ma_length: 10                   # source: doc-scaled，文档 sma(smart_money, 5)
  cumulative: false               # source: doc，文档聪明钱未用 ta.cum（AD 线才用）
  absolute_threshold: null        # source: doc-void，文档只有方向判定 smart_money > ma
  positive_z_threshold: 1.5       # source: decided（ADR-0025），A 股实测：value > MA 且
                                  #   z=(value-MA)/std ≥ 1.5 才为正；触发频率 48%→8%，
                                  #   w4 前向收益预测力 +0.30%→+1.53%

institutional:
  volume_multiple: 2.5            # source: doc（文档公式缺乘号，正文写 2.5 倍）
  ad_ma_length: 10                # source: doc-scaled，文档 sma(ad, 5)
  # AD 线原文：ta.cum(((close - low) - (high - close)) / (high - low) * volume)
  ad_cumulative: true             # source: doc

# ---------------------------------------------------------------------------
# 纳什均衡带（文档 4.4）
# ---------------------------------------------------------------------------
nash:
  period: 16                      # source: decided，A 股 K_120M 使用 8 个交易日
  ma_type: sma                    # source: doc，文档明确 ta.sma
  deviation: 1.5                  # source: decided，A 股实测收窄（ADR-0025），原 2.0；带内占比 88.6%→约 75%

  # 为什么 deviation = 2.0 而不是 0.02：
  # 文档从未字面赋值 nash_deviation。公式结构是 price_std * nash_deviation
  # （标准差倍数），但三处正文都称「2% 偏差率」。取 0.02 不是「可能性较低」
  # 而是数学退化：10 元股票 8 根 K 线收盘标准差约 0.15，乘 0.02 得 0.003，
  # 带宽 ±0.03%，价格几乎永远在带外 —— near_nash_equilibrium 恒假、
  # above/below_nash 恒真、动量与回归信号每根 K 线都触发，信号失去区分度。
  # 正文的「2%」更可能是作者回测中带宽的实际观测宽度
  # （2.0 × std ≈ ±3%，量级吻合），不是该变量的赋值。
  #
  # 上下界：
  #   upper = sma(close, period) + stdev(close, period) * deviation
  #   lower = sma(close, period) - stdev(close, period) * deviation

# ---------------------------------------------------------------------------
# 异常 K 线处理（A 股特有，文档未覆盖）
# ---------------------------------------------------------------------------
# 聪明钱与 AD 线的分母都是 (high - low)。A 股一字板涨跌停时 high == low，
# 分母为 0。文档无涨跌停概念，这个缺口必须本项目自己封。
#
# 处置遵循项目铁律「不返回带低置信度警告的概率，直接返回数据不足」：
# 该根 K 线的相关信号置为不可用，不参与推演，也不用 epsilon 或前值填充。
# 用 epsilon 会产出一个量级取决于 epsilon 大小的伪值；沿用前值会把
# 停止交易的一根 K 线伪装成有信息的一根。
degenerate_bar:
  zero_range_policy: insufficient_data   # source: decided
  affected_signals:                      # 分母含 (high - low) 的信号
    - smart_money
    - institutional_ad
  # 不受影响的信号（不含该分母）仍照常计算
  epsilon_fallback: false
  carry_forward_previous: false

# ---------------------------------------------------------------------------
# 信号在本项目中的定位
# ---------------------------------------------------------------------------
# 文档把 contrarian_buy / momentum_buy / nash_reversion_buy 直接当买卖信号用，
# 并在第六章给出仓位管理（0.5 / 1.0 / 1.5）。本项目两者都不采用：
#
#   1. 信号降级为观测特征。本系统的链路是「信号 → 喂给大模型判断周期位置
#      与推断行为」，不是「信号 → 下单」。文档 5.4 综合买卖信号只写了
#      「通过布尔逻辑，设置好规则」而没给公式 —— 这个缺口对本项目无害，
#      因为本项目本来就不需要合成买卖点。
#   2. 不收仓位管理。ADR-0015 已定二阶博弈只输出布尔闸门与推演文本，
#      仓位归 PA_Agent。收进来会出现两个仓位决策权。
usage:
  role: observation_feature       # 不是 trade_signal
  emit_composite_signal: false    # 文档 5.4 未给公式，且本项目不需要
  emit_position_size: false       # 文档第六章不采用，仓位归 PA

# 三类信号的布尔组合（文档第五章原文，作为特征保留）
composite_features:
  # ⚠ contrarian_buy 已移除 liquidity_trap_down（ADR-0026）：trap_down 在
  #   A 股是「破位下跌延续」（看跌），不再作为逆势买入（看涨）的条件。
  contrarian_buy:   [herd_selling, "accumulation"]
  contrarian_sell:  [herd_buying,  "distribution OR liquidity_trap_up"]
  momentum_buy:     [below_nash, smart_money_positive, "NOT herd_buying"]
  momentum_sell:    [above_nash, "NOT smart_money_positive", "NOT herd_selling"]
  # ⚠ 回归信号的成交量条件是 volume > volume_ma（1 倍），不是 volume_spike
  #   （2 倍）。这是文档原文写法，非笔误修正 —— 若要改必须走 ADR。
  nash_reversion_buy:  [below_nash, "close > close[1]", "volume > volume_ma"]
  nash_reversion_sell: [above_nash, "close < close[1]", "volume > volume_ma"]

# ---------------------------------------------------------------------------
# 文档明确挂空的参数
# ---------------------------------------------------------------------------
# 文档第三章 P025 原文：「止盈止损参数：随后设置，确保交易风险可控」——
# 自己挂了空。第九章 P168 提到「固定的止损止盈比例」存在不足，仍未给数值。
#
# 本项目不需要填这些：止盈止损由 PA_Agent 的 trade_metrics 计算
# （MIN_RISK_REWARD_RATIO / MAX_TP1_RISK_REWARD_RATIO），二阶博弈不参与。
# 列在此处是为了让后续读者知道这是「已确认不需要」而非「遗漏」。
not_applicable:
  take_profit_pct: "PA_Agent 负责"
  stop_loss_pct: "PA_Agent 负责"
  max_single_risk: "PA_Agent 负责"
  signal_cooldown: "观测特征无需冷却期"
  signal_conflict_arbitration: "特征可同时为真，无需仲裁"
